<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>Email Header</title>
</head>
<body>
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background: #f5f5f5;">
  <tr>
    <td align="center">
      <table role="presentation" width="600" cellspacing="0" cellpadding="0" border="0">
        <tr>
          <td style="background: linear-gradient(90deg, #4A90E2, #9013FE); padding: 20px; color:#ffffff; font-family: Arial, sans-serif;">
            <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0">
              <tr>
                <td style="text-align:left;">
                  <!-- Replace 'logo.png' with your logo path -->
                  <img src="logo.png" alt="Logo" width="120" style="display:block;">
                </td>
                <td style="text-align:right; font-size:28px; font-weight:bold;">
                  اسم الشركة
                </td>
              </tr>
            </table>
          </td>
        </tr>
        <!-- Additional header content can be placed here -->
      </table>
    </td>
  </tr>
</table>
</body>
</html>
